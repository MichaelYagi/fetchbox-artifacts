name: Build desktop apps

# Builds the unsigned Windows 10/11 installer and .exe, the macOS Apple Silicon and
# Intel disk images and the Linux (x86_64) .deb, AppImage and binary for a tag of the public
# MichaelYagi/fetchbox repo, smoke-tests each one, and publishes them together as a
# GitHub Release of *this* private repo: a release of a public repo is downloadable by
# any signed-in GitHub user, a release of a private one isn't.
#
# Every build ships with LICENSE.txt and THIRD-PARTY-NOTICES.txt (generated from what's
# actually inside it: packaging/gen_third_party_notices.py in the public repo), because
# the bundled libraries' licenses require their notices to travel with the copies.
#
# Triggered:
#   - automatically: the public repo's notify-desktop.yml sends a repository_dispatch
#     (event "public-tag") when a vX.Y.Z tag is pushed there
#   - by hand: gh workflow run desktop-build.yml -R MichaelYagi/fetchbox-artifacts -f tag=v0.1.0
#     A test build of a branch (nothing published):
#     gh workflow run desktop-build.yml -R MichaelYagi/fetchbox-artifacts -f tag=main -f publish=false
#
# No secrets needed while fetchbox is public (checkout uses this workflow's own token).
on:
  repository_dispatch:
    types: [public-tag]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of MichaelYagi/fetchbox to build (vX.Y.Z); with publish off, any branch"
        required: true
        type: string
      publish:
        description: "Publish a Release here (only for vX.Y.Z tags)"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.client_payload.tag || inputs.tag }}
  PUBLISH: ${{ github.event_name == 'repository_dispatch' || inputs.publish }}
  PYTHON: "3.12"

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      # The tag arrives from an API payload: refuse anything odd before it reaches a
      # checkout ref, an artifact name or a shell.
      - name: Check the ref
        id: v
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          elif [[ "$PUBLISH" != "true" && "$TAG" =~ ^[A-Za-z0-9._/-]{1,100}$ ]]; then
            echo "version=" >> "$GITHUB_OUTPUT"   # a branch test build: version not checked
          else
            echo "::error::'$TAG' isn't a vX.Y.Z tag (a branch only builds with publish off)"
            exit 1
          fi
          echo "Building $TAG (publish: $PUBLISH)"

  tests:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: MichaelYagi/fetchbox
          ref: ${{ env.TAG }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python ${{ env.PYTHON }}
      - run: uv run pytest -q

  build:
    name: ${{ matrix.label }}
    needs: [validate, tests]
    # Built natively on each architecture (no cross-compiling, no universal2: not every
    # compiled dependency ships universal2 wheels). macos-15-intel is GitHub's last Intel
    # runner image (until about August 2027).
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: macOS Silicon, runner: macos-15, os: macos, arch: arm64, asset: Fetchbox-macOS-Silicon }
          - { label: macOS Intel, runner: macos-15-intel, os: macos, arch: x86_64, asset: Fetchbox-macOS-Intel }
          - { label: Windows 10-11, runner: windows-latest, os: windows, arch: x64, asset: Fetchbox-Windows-10-11 }
          - { label: Linux x86_64, runner: ubuntu-latest, os: linux, arch: x86_64, asset: Fetchbox-Linux-x86_64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          repository: MichaelYagi/fetchbox
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        run: |
          case "${{ matrix.os }}" in
            macos)   PYTHON=python packaging/build-macos.sh ;;
            linux)   PYTHON=python packaging/build-linux.sh ;;
            windows) pwsh -File packaging/build-windows.ps1 ;;
          esac
      - name: Locate the program
        id: exe
        run: |
          case "${{ matrix.os }}" in
            macos)   echo "path=dist/Fetchbox.app/Contents/MacOS/Fetchbox" >> "$GITHUB_OUTPUT" ;;
            linux)   echo "path=dist/fetchbox" >> "$GITHUB_OUTPUT" ;;
            windows) echo "path=dist/Fetchbox.exe" >> "$GITHUB_OUTPUT" ;;
          esac
          PY=.venv-build/bin/python; [ -f .venv-build/Scripts/python.exe ] && PY=.venv-build/Scripts/python.exe
          echo "python=$PY" >> "$GITHUB_OUTPUT"
      # PyInstaller builds for the runner's architecture, so a wrong runner label would
      # ship the wrong build under the right name. Fail instead.
      - name: Check the architecture
        if: matrix.os == 'macos'
        run: |
          got="$(lipo -archs "${{ steps.exe.outputs.path }}")"
          echo "built: $got"
          [[ "$got" == "${{ matrix.arch }}" ]] || { echo "::error::expected ${{ matrix.arch }}, built $got"; exit 1; }
      - name: Smoke test (scratch data folder; must answer and report the version)
        run: |
          "${{ steps.exe.outputs.python }}" packaging/smoke_test.py "${{ steps.exe.outputs.path }}" \
            "${{ needs.validate.outputs.version || 'any' }}"
      - name: Add the README, LICENSE and third-party notices
        run: |
          DESKTOP=""; [[ "${{ matrix.os }}" != linux ]] && DESKTOP="--desktop"
          { echo "Fetchbox $TAG -- ${{ matrix.label }}"; echo; cat "packaging/README-${{ matrix.os }}-artifact.txt"; } > dist/README.txt
          cp LICENSE dist/LICENSE.txt
          "${{ steps.exe.outputs.python }}" packaging/gen_third_party_notices.py dist/THIRD-PARTY-NOTICES.txt $DESKTOP
      # Packaged files, not a raw directory upload (which can lose the Unix executable
      # bit). These files *are* the release assets.
      - name: Package
        id: pkg
        env:
          MSYS_NO_PATHCONV: "1"  # Git Bash would turn ISCC's /D options into paths
        run: |
          NAME="${{ matrix.asset }}-${TAG//\//-}"
          VER="${{ needs.validate.outputs.version }}"; VER="${VER:-0.0.0}"  # branch builds
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          case "${{ matrix.os }}" in
            linux)
              tar -czf "$NAME.tar.gz" -C dist .
              packaging/linux/make_packages.sh "$VER" "$NAME" ;;
            macos)
              packaging/macos/make_dmg.sh "$NAME.dmg" ;;
            windows)
              (cd dist && 7z a -tzip "../$NAME.zip" . > /dev/null)
              ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
              if [ ! -f "$ISCC" ]; then choco install innosetup -y --no-progress > /dev/null; fi
              "$ISCC" /Q "/DAppVersion=$VER" "/F$NAME-Setup" packaging\\windows\\fetchbox.iss ;;
          esac
          ls -la "$NAME"*
      # Each installer as a user would meet it: install, check what it set up, run the
      # installed copy, uninstall.
      - name: Test the installers
        env:
          MSYS_NO_PATHCONV: "1"
          NAME: ${{ steps.pkg.outputs.name }}
          WANT: ${{ needs.validate.outputs.version || 'any' }}
          PY: ${{ steps.exe.outputs.python }}
        run: |
          case "${{ matrix.os }}" in
            linux)
              sudo apt-get install -y -qq "./$NAME.deb" > /dev/null
              for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/api/v1/system/ping > /dev/null && break; sleep 1; done
              systemctl is-active fetchbox
              curl -sf http://127.0.0.1:8787/api/v1/system/ping
              sudo test -f /var/lib/fetchbox/data/fetchbox.db
              "$PY" packaging/smoke_test.py /usr/bin/fetchbox "$WANT"
              sudo apt-get remove -y -qq fetchbox > /dev/null
              if systemctl is-active --quiet fetchbox; then echo '::error::still running after remove'; exit 1; fi
              sudo test -d /var/lib/fetchbox/data   # the data is kept
              # Unpacked, then its AppRun: extract-and-run mode doesn't pass the stop
              # signal on, which would leave the server running
              mkdir appimage-test && (cd appimage-test && "../$NAME.AppImage" --appimage-extract > /dev/null)
              "$PY" packaging/smoke_test.py appimage-test/squashfs-root/AppRun "$WANT"
              rm -rf appimage-test ;;
            macos)
              hdiutil attach -nobrowse -readonly -mountpoint /tmp/fbdmg "$NAME.dmg" > /dev/null
              test -L /tmp/fbdmg/Applications
              "$PY" packaging/smoke_test.py /tmp/fbdmg/Fetchbox.app/Contents/MacOS/Fetchbox "$WANT"
              hdiutil detach /tmp/fbdmg > /dev/null ;;
            windows)
              APP="$LOCALAPPDATA/Programs/Fetchbox"
              "./$NAME-Setup.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /TASKS=startup /LOG=setup.log \
                || { cat setup.log; exit 1; }
              test -f "$APP/Fetchbox.exe"
              test -f "$APPDATA/Microsoft/Windows/Start Menu/Programs/Fetchbox.lnk"
              reg query 'HKCU\Software\Microsoft\Windows\CurrentVersion\Run' /v Fetchbox
              "$PY" packaging/smoke_test.py "$APP/Fetchbox.exe" "$WANT"
              "$APP/unins000.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
              # the uninstaller hands over to a copy of itself and returns at once
              for i in $(seq 1 60); do [ -e "$APP/Fetchbox.exe" ] || break; sleep 1; done
              if [ -e "$APP/Fetchbox.exe" ]; then echo "::error::not uninstalled"; exit 1; fi
              if reg query 'HKCU\Software\Microsoft\Windows\CurrentVersion\Run' /v Fetchbox > /dev/null 2>&1; then
                echo '::error::the login entry is still there'; exit 1
              fi ;;
          esac
          echo "installers ok"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}-*
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'repository_dispatch' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true
      - run: ls -la downloads
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Fetchbox ${{ env.TAG }}
          body: |
            Desktop builds of [Fetchbox ${{ env.TAG }}](https://github.com/MichaelYagi/fetchbox/releases/tag/${{ env.TAG }}), unsigned.

            - **Windows 10/11:** `-Setup.exe` installs for your user (no administrator needed); the `.zip` runs without installing.
            - **macOS:** open the `.dmg` for your Mac (Apple Silicon or Intel) and drag Fetchbox to Applications.
            - **Linux x86_64:** the `.deb` installs a service (Debian, Ubuntu); the `.AppImage` runs on any distribution; the `.tar.gz` is the plain program.

            Each comes with a README (including how to get past Gatekeeper / SmartScreen), LICENSE and THIRD-PARTY-NOTICES.
          files: |
            downloads/*.zip
            downloads/*.tar.gz
            downloads/*.dmg
            downloads/*-Setup.exe
            downloads/*.deb
            downloads/*.AppImage
